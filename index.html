@media (max-width:640px){.logo{width:min(156px,100%)}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top-l{min-width:0}
.title{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.sub{margin:3px 0 0;font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:6px;flex:none}
.mnav{position:relative;display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;color:var(--ink);transition:border-color .15s,background .15s}
.mnav::after{content:"";position:absolute;inset:-5px}
.mnav:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
.mnav:disabled{opacity:.3;cursor:default}
.mnav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pill-today{height:30px;margin-right:4px;padding:0 12px;border:0;border-radius:999px;background:var(--soft);font-size:12.5px}

/* ---------- focus ---------- */
.focus{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:22px;padding:26px 0 24px;border-bottom:1px solid var(--line)}
.ring{position:relative;width:148px;height:148px;padding:0;border:0;background:none;border-radius:50%}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring svg circle{fill:none}
.ring{transition:transform .15s}
.ring:active{transform:scale(.985)}
.ring .arc{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-v{font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ring-s{margin-top:6px;max-width:96px;text-align:center;line-height:1.25;font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.ring.done .ring-s{color:var(--accent);font-weight:500}
.ring.done::before{content:"";position:absolute;inset:6px;border-radius:50%;box-shadow:0 0 34px -6px color-mix(in srgb,var(--accent) 55%,transparent);pointer-events:none}
.legend{list-style:none;margin:0;padding:0;min-width:0}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:28px;font-size:13.5px}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .tm{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.sw{display:block;width:10px;height:10px;border-radius:3px}
.legend li.zero{color:var(--muted)}
.legend li.zero .sw{opacity:.45}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.facts b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:380px){.focus{gap:16px}.ring{width:128px;height:128px}.ring-v{font-size:30px}}

/* ---------- now ---------- */
.now{padding:26px 0 28px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.live .dot{animation:ring 2.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--kc,var(--accent)) 45%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now-title{margin:0;font-size:21px;font-weight:500;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.timer{display:flex;align-items:baseline;margin:12px 0 2px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1}
.timer .big{font-size:64px}
.timer .sec{color:color-mix(in srgb,var(--ink) 28%,var(--bg))}
.since{margin:8px 0 0;font-size:13px;color:var(--muted)}
.par{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-radius:14px}
.par .pt{flex:1;min-width:0}
.par .pn{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500}
.par .ps{margin-top:1px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.par-end{flex:none;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;font-size:13px}
.par-end:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.cap{margin:24px 0 8px;font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ---------- composer ---------- */
.block{padding:26px 0 0}
.box{display:flex;align-items:flex-end;gap:8px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:color-mix(in srgb,var(--ink) 32%,var(--line));box-shadow:0 8px 24px -14px color-mix(in srgb,var(--ink) 30%,transparent)}
.box textarea,.box input{flex:1;min-width:0;border:0;outline:none;background:transparent;resize:none;padding:9px 10px;font-size:15.5px;line-height:1.45;min-height:40px;max-height:180px}
.box textarea{overflow:hidden}
.go{flex:none;height:40px;padding:0 18px;border:0;border-radius:11px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;transition:opacity .15s,transform .1s}
.go:active:not(:disabled){transform:scale(.97)}
.go:disabled{background:var(--soft);color:color-mix(in srgb,var(--ink) 30%,var(--bg));cursor:default}
.go.kc{background:var(--kc,var(--accent));color:var(--on)}
.go.kc.lite{color:#1f2421}
.hint{margin:9px 2px 0;font-size:12.5px;color:var(--muted)}
.or{margin:16px 2px 8px;font-size:12.5px;color:var(--muted)}

.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;transition:border-color .15s,background .15s,transform .1s}
.pick:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.pick:active{transform:scale(.98)}
.pick .pk{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .pl{font-size:15px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.pick .ps{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .sw{width:12px;height:12px;border-radius:4px;flex:none}
.pick > svg{flex:none;width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pick.on{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 8%,var(--surface))}
.pick.on .ps{color:var(--kc)}
.pick.back{grid-column:1/-1;min-height:36px;padding:0 4px;border:0;background:none;color:var(--muted);font-size:13px;gap:6px}
.pick.back > svg{order:-1}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* ---------- day timeline ---------- */
.dayv{margin-top:38px}
.dayv-h{display:flex;align-items:baseline;justify-content:space-between}
.dayv-h .eyebrow{margin:0}
.dayv-h span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{position:relative;margin-top:16px}
.hr{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--line) 75%,transparent)}
.hr span{position:absolute;left:0;top:-7px;width:34px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--bg);letter-spacing:.02em}
.area{position:absolute;left:44px;right:0;top:0;bottom:0}
.tl-body{position:relative}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.col{position:relative;border-radius:10px}
.col.cur{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.cols-h{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px 44px}
.col-h{display:flex;flex-direction:column;padding:0 2px;min-width:0}
.ch-d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-f{font-size:15px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--muted)}
.ch-p{display:block;height:3px;margin-top:6px;border-radius:2px;background:var(--soft);overflow:hidden}
.ch-p i{display:block;height:100%;border-radius:2px;background:color-mix(in srgb,var(--ink) 30%,var(--bg))}
.col-h.cur .ch-p i{background:var(--accent)}
.col-h.cur .ch-d{color:var(--ink);font-weight:500}
.col-h.cur .ch-f{color:var(--ink)}
.band{position:absolute;left:2px;right:2px;min-height:4px;padding:0;border:0;border-radius:10px;background:var(--kc);color:var(--on);text-align:left;overflow:hidden;cursor:pointer;transition:filter .15s,transform .15s;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.band:hover{filter:brightness(1.04) saturate(1.05)}
.band.lite{color:#1f2421}
.itflag{position:absolute;right:6px;top:6px;width:15px;height:10px;border-radius:2px;background:linear-gradient(90deg,#009246 0 33.4%,#f4f5f0 33.4% 66.6%,#ce2b37 66.6%);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.band.ov .bt{right:4px;left:5px;top:16px}
.band.ov .itflag{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);width:15px;height:10px}
.band.ov:not(.tiny) .itflag{top:5px;left:5px;transform:none}
.band.ov{left:auto;right:3px;width:46%;box-shadow:0 0 0 2px var(--bg),0 6px 16px -6px rgba(0,0,0,.35);z-index:2}
.band .bt{position:absolute;left:8px;right:6px;top:5px;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.band .bn{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .bm{font-size:11px;opacity:.82;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band.tiny .bt{display:none}
.band.slim .bm{display:none}
.band.slim .bt{top:50%;transform:translateY(-50%)}
.band.live::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.14) 6px 12px);background-size:34px 34px;animation:slide 1.6s linear infinite;pointer-events:none}
.band.live{border-bottom-left-radius:4px;border-bottom-right-radius:4px}
@keyframes slide{to{background-position:34px 0}}
.npin{position:absolute;right:3px;width:8px;height:8px;margin-top:-4px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 40%,var(--line));box-shadow:0 0 0 2px var(--bg);z-index:3}
.npin::after{content:"";position:absolute;inset:-8px}

/* ---------- chronicle ---------- */
.chron{margin-top:40px}
.ev{display:grid;grid-template-columns:44px 18px minmax(0,1fr);column-gap:12px;position:relative}
.ev .t{padding-top:15px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
.ev .t i{display:block;font-style:normal;opacity:.7}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);background:var(--line)}
.ev:first-child .rail::before{top:20px}
.ev:last-child .rail::before{bottom:calc(100% - 20px)}
.node{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:var(--kc,var(--ink));box-shadow:0 0 0 3px var(--bg)}
.ev.live .node{box-shadow:0 0 0 3px var(--bg),0 0 0 6px color-mix(in srgb,var(--kc) 22%,transparent)}
.ev.note .node{width:5px;height:5px;top:19px;background:color-mix(in srgb,var(--ink) 35%,var(--line))}
.ev .c{min-width:0;padding:10px 0 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.ev:last-child .c{border-bottom:0}
.hit{display:block;width:100%;padding:3px 0;margin:0;border:0;background:none;text-align:left;border-radius:6px}
.hit:hover .ttl,.hit:hover .ntext{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.ttl{display:block;font-size:15.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.dur{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev.live .dur{color:var(--kc)}
.inner{margin:8px 0 0;padding:2px 0 2px 14px;border-left:2px solid color-mix(in srgb,var(--kc,var(--line)) 35%,transparent);display:flex;flex-direction:column;gap:2px}
.inner .hit{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 0}
.inner .it{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ntext{font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.refl{margin-top:10px;font-size:14px;line-height:1.5;color:color-mix(in srgb,var(--ink) 78%,var(--bg));white-space:pre-wrap;overflow-wrap:anywhere}
.refl .lab{display:block;margin-bottom:2px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ev.note .c{padding:12px 0}

.foot{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.foot-r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.foot{flex-direction:column}.foot-r{justify-content:flex-start}}
.status{display:flex;align-items:center;gap:7px;min-height:36px;font-size:12.5px;color:var(--muted)}
.status i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.status.on i{background:var(--accent)}
.link-btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);font-size:12.5px;transition:border-color .15s}
.link-btn:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,24,22,.28);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:auto;padding:22px 20px 18px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:0 24px 60px -16px rgba(20,24,22,.3);transform:translateY(10px) scale(.985);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.scrim.open .sheet{transform:none}
@media (max-width:640px){.scrim{align-items:flex-end;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.sheet{max-width:none;transform:translateY(24px)}}
.sheet h2{margin:0 0 4px;font-size:18px;font-weight:500}
.sheet .cap{margin:18px 0 7px;font-size:10px;letter-spacing:.14em}
.fld{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:transparent;padding:11px 12px;font-size:15px;outline:none;resize:none}
.fld:focus{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
textarea.fld{min-height:84px;line-height:1.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=time].fld{font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;min-height:46px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.stepper button{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:none;font-size:22px;font-weight:300}
.stepper b{font-size:38px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:8px;margin-top:22px}
.del{margin-right:auto;min-height:40px;padding:0 4px;border:0;background:none;color:var(--danger);font-size:14px}
.ghost{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:none;font-size:14px}
.save{height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500}
@media (max-width:640px){.fld,.box textarea,.box input{font-size:16px}.ghost,.save{height:46px}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,8px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.live .dot,.fade,.band.live::after{animation:none}.sheet,.scrim,.toast,.ring .arc{transition:none}}
</style>
</head>
<body>
<main class="app">
  <h1 class="brand"><span class="logo" role="img" aria-label="Piano piano"></span></h1>

  <header class="top">
    <div class="top-l">
      <h2 class="title" id="dayTitle">Сегодня</h2>
      <p class="sub" id="daySub"></p>
    </div>
    <div class="nav">
      <button class="pill-today" id="todayBtn" hidden>Сегодня</button>
      <button class="mnav" id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="mnav" id="next" aria-label="Следующий день"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </header>

  <!-- Фокус -->
  <section class="focus" aria-label="Фокус за день">
    <button class="ring" id="ring" type="button" aria-label="Цель фокуса">
      <svg viewBox="0 0 148 148" id="ringSvg"></svg>
      <span class="ring-c"><span class="ring-v" id="ringV">0:00</span><span class="ring-s" id="ringS">из 4 ч</span></span>
    </button>
    <div>
      <p class="eyebrow" id="focusLabel">Фокус сегодня</p>
      <ul class="legend" id="legend"></ul>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <!-- Сейчас -->
  <section class="now" id="now" hidden>
    <div id="activeView" hidden>
      <p class="eyebrow live" id="liveEyebrow"><span class="dot" id="liveDot"></span><span>Сейчас</span></p>
      <h2 class="now-title" id="activeTitle"></h2>
      <div class="timer"><span class="big" id="tBig">0</span><span class="big sec" id="tSec">:00</span></div>
      <p class="since" id="activeSince"></p>
      <div id="parallel"></div>
      <p class="cap">Итог — по желанию</p>
      <div class="box">
        <textarea id="endNote" rows="1" aria-label="Итог"></textarea>
        <button class="go kc" id="endBtn">Завершить</button>
      </div>
    </div>
  </section>

  <!-- Начать -->
  <section class="block">
    <p class="eyebrow" id="startLabel">Начать дело</p>
    <div class="picks" id="picks"></div>
    <p class="or">или своё</p>
    <div class="box">
      <input id="startInput" aria-label="Своё дело" autocomplete="off" enterkeyhint="go">
      <button class="go" id="startBtn" disabled>Начать</button>
    </div>
  </section>

  <!-- Состояние -->
  <section class="block">
    <p class="eyebrow">Как ты сейчас</p>
    <div class="box">
      <textarea id="noteInput" rows="1" aria-label="Как ты сейчас"></textarea>
      <button class="go" id="noteBtn" disabled>Записать</button>
    </div>
    <p class="hint" id="noteHint" hidden></p>
  </section>

  <!-- День -->
  <section class="dayv">
    <div class="dayv-h"><p class="eyebrow">День</p><span id="rangeLbl"></span></div>
    <div class="tl" id="tl"></div>
  </section>

  <section class="chron" id="chron" hidden>
    <p class="eyebrow">Хроника</p>
    <div id="timeline"></div>
  </section>

  <footer class="foot">
    <span class="status" id="status"><i></i><span id="statusText">Хранится на этом устройстве</span></span>
    <span class="foot-r">
      <button class="link-btn" id="copyBtn">Скопировать день</button>
      <button class="link-btn" id="exportBtn">Экспорт всего в .txt</button>
      <button class="link-btn" id="backupBtn">Резервная копия</button>
      <button class="link-btn" id="restoreBtn">Восстановить</button>
    </span>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </footer>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
    <div class="acts">
      <button class="del" id="sheetDel">Удалить</button>
      <button class="ghost" id="sheetCancel">Отмена</button>
      <button class="save" id="sheetSave">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  /* ================= categories ================= */
  const CATS=[
    {t:"Работа", sub:["Собор","Da.school","Академия талантов"]},
    {t:"Рутина"},{t:"Чтение"},{t:"Итальянский"},{t:"Спорт"},{t:"Ходьба"}
  ];
  const KNOWN={"Работа":"work","Итальянский":"ital","Рутина":"rout","Чтение":"read","Ходьба":"walk","Спорт":"sport"};
  const group=t=>t==="Работа"||t.startsWith("Работа · ")?"Работа":t;
  const CUSTOM=["c4","c1","c3","c7"];
  const LITE=new Set(["c3","c7"]);
  const isItal=t=>t==="Итальянский", isRout=t=>t==="Рутина", isFocus=t=>!isRout(t)&&t!=="Ходьба"&&t!=="Спорт";
  const compat=(a,b)=>(isItal(a)&&isRout(b))||(isRout(a)&&isItal(b));
  function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h); }
  function ckey(t){ t=group(t); return KNOWN[t] ? "k-"+KNOWN[t] : CUSTOM[hash(t)%CUSTOM.length]; }
  function kc(t){ return `var(--${ckey(t)})`; }
  function lite(t){ return LITE.has(ckey(t)); }
  function short(t){ return t.startsWith("Работа · ") ? t.slice(9) : t; }
  function swatch(t,cls){ const s=document.createElement("span"); s.className=cls||"sw"; s.style.background=kc(t); return s; }

  const LS="ij-journal-gh1", LSS="ij-settings-gh1";
  const EMO={"😊":"радость","😌":"спокойствие","🎯":"фокус","✨":"интерес","😮‍💨":"усталость","😟":"тревога","😤":"раздражение","😔":"грусть"};
  const $=id=>document.getElementById(id);
  const H=3600000, M=60000;

  let days={}, settings={goalMin:600};
  let view=dkey(new Date());
  let col=null, openCat=null;
  const writing={}, pending={};

  /* ================= utils ================= */
  function dkey(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function day(k){ return days[k] || (days[k]={date:k,items:[]}); }
  function hm(t){ const d=new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function dur(ms){ const m=Math.floor(ms/M); if(m<1) return "меньше минуты"; const h=Math.floor(m/60), r=m%60; return h?(r?`${h} ч ${r} мин`:`${h} ч`):`${r} мин`; }
  function hmm(ms){ const m=Math.floor(Math.max(0,ms)/M); return Math.floor(m/60)+":"+String(m%60).padStart(2,"0"); }
  function goalTxt(min){ const h=Math.floor(min/60), r=min%60; return h?(r?`${h} ч ${r} мин`:`${h} ч`):`${r} мин`; }
  function plural(n,a,b,c){ const m=n%10,h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<12||h>14)) return b; return c; }
  function dayLabel(k){
    const today=dkey(new Date()), y=new Date(); y.setDate(y.getDate()-1);
    const d=new Date(k+"T12:00:00");
    const long=d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"}), wd=d.toLocaleDateString("ru-RU",{weekday:"long"});
    if(k===today) return ["Сегодня",wd+", "+long];
    if(k===dkey(y)) return ["Вчера",wd+", "+long];
    return [long[0].toUpperCase()+long.slice(1),wd];
  }
  function noteText(n){ return (n.text||"") || (n.emo?(EMO[n.emo]||""):""); }
  function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900); }
  function buzz(){ try{ navigator.vibrate&&navigator.vibrate(10); }catch(e){} }

  function actives(){ const out=[]; for(const k in days) for(const it of days[k].items) if(it.kind==="act"&&!it.end) out.push({k,it}); return out.sort((a,b)=>b.it.start-a.it.start); }
  // главное дело: последнее начатое, но рутина уступает параллельному делу
  function primary(){ const a=actives(); if(!a.length) return null; return a.find(x=>!isRout(x.it.title)) || a[0]; }
  function lastEnded(){ let best=null; const now=Date.now(); for(const k in days) for(const it of days[k].items) if(it.kind==="act"&&it.end&&it.end<=now&&(!best||it.end>best.end)) best=it; return best; }

  /* ================= persistence ================= */
  function loadLocal(){ try{ const s=localStorage.getItem(LS); if(s) days=JSON.parse(s)||{}; const t=localStorage.getItem(LSS); if(t) settings=Object.assign(settings,JSON.parse(t)); if(settings.goalMin===240) settings.goalMin=600; }catch(e){} }
  function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(days)); localStorage.setItem(LSS,JSON.stringify(settings)); }catch(e){} }
  function save(k){ if(!col){ saveLocal(); return; } pending[k]=true; flush(k); }
  function saveSettings(){ if(!col){ saveLocal(); return; } pending.__s=true; flush("__s"); }
  async function flush(k){
    if(writing[k]) return; writing[k]=true;
    while(pending[k]){
      pending[k]=false;
      try{
        if(k==="__s") await col.doc("settings").set(JSON.parse(JSON.stringify(settings)));
        else { const d=JSON.parse(JSON.stringify(days[k]||{date:k,items:[]})); const ref=col.doc(k); if(d.items.length) await ref.set(d); else await ref.delete(); }
      }catch(e){
        if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); pending[k]=true; continue; }
        toast(e&&e.code==="quota_exceeded"?"Хранилище заполнено":"Не удалось сохранить"); saveLocal();
      }
    }
    writing[k]=false;
  }
  function setStatus(on,text){ $("status").classList.toggle("on",on); $("statusText").textContent=text; }
  const inClaude=!!(window.claude&&window.claude.use);
  async function connect(){
    if(!inClaude) return;
    try{
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      const c=db.collection("data/users/"+id);
      const localCopy=days, localSet=Object.assign({},settings); let first=true;
      setStatus(false,"Подключаюсь…");
      const timer=setTimeout(()=>setStatus(false,"Нет связи — записи могут быть не сохранены"),10000);
      c.onSnapshot(snap=>{
        if(!snap.metadata.fromCache) clearTimeout(timer);
        const next={}; let gotSet=null;
        snap.docs.forEach(doc=>{ const v=doc.data(); if(!v) return;
          if(doc.id==="settings"){ gotSet=v; return; }
          if(/^\d{4}-\d{2}-\d{2}$/.test(doc.id)&&Array.isArray(v.items)) next[doc.id]={date:doc.id,items:JSON.parse(JSON.stringify(v.items))}; });
        for(const k in days) if(writing[k]||pending[k]) next[k]=days[k];
        if(gotSet && !(writing.__s||pending.__s)) settings=Object.assign({goalMin:600},gotSet); if(settings.goalMin===240) settings.goalMin=600;
        if(first){
          first=false; col=c; days=next;
          for(const k in localCopy) if(!next[k]&&localCopy[k].items&&localCopy[k].items.length){ next[k]=localCopy[k]; save(k); }
          if(!gotSet && localSet.goalMin!==600&&localSet.goalMin!==240){ settings=localSet; saveSettings(); }
          try{ localStorage.removeItem(LS); localStorage.removeItem(LSS); }catch(e){}
        }
        if(!snap.metadata.fromCache) setStatus(true,"Сохраняется в личном хранилище");
        days=next; render();
      },()=>{ clearTimeout(timer); col=null; saveLocal(); setStatus(false,"Хранится на этом устройстве"); });
    }catch(e){}
  }

  /* ================= actions ================= */
  function start(title){
    const now=Date.now(), act=actives();
    if(act.some(x=>x.it.title===title)){ toast("Уже идёт"); return; }
    let kept=null;
    act.forEach(x=>{ if(compat(x.it.title,title)) kept=x.it; else { x.it.end=now; save(x.k); } });
    const k=dkey(new Date(now));
    day(k).items.push({id:uid(),kind:"act",title,start:now,end:null,endNote:""});
    save(k); view=k; openCat=null; buzz(); render(true);
    if(kept) toast(isItal(title)?"Итальянский — параллельно с рутиной":"Рутина — параллельно с итальянским");
  }
  function finish(id,note){
    const a=actives().find(x=>x.it.id===id); if(!a) return;
    a.it.end=Date.now(); if(note) a.it.endNote=note;
    save(a.k); buzz(); render(true); toast("Завершено · "+dur(a.it.end-a.it.start));
  }
  function addNote(text){
    const now=Date.now(), p=primary(), k=dkey(new Date(now));
    day(k).items.push({id:uid(),kind:"note",text,t:now,actId:p&&p.k===k?p.it.id:null});
    save(k); view=k; render(true);
  }

  /* ================= stats ================= */
  function stats(k){
    const now=Date.now(), base=new Date(k+"T00:00:00").getTime(), end=base+24*H;
    const pk=(()=>{ const d=new Date(k+"T12:00:00"); d.setDate(d.getDate()-1); return dkey(d); })();
    const carried=(days[pk]?.items||[]).filter(i=>i.kind==="act"&&(i.end||now)>base).map(i=>Object.assign({},i,{start:base}));
    const acts=[...carried,...(days[k]?.items||[]).filter(i=>i.kind==="act")].map(i=>Object.assign({},i,{end:Math.min(i.end||now,end)})).filter(i=>i.end>i.start);
    const f=acts.filter(a=>isFocus(a.title)).map(a=>({s:a.start,e:a.end,t:a.title})).sort((a,b)=>a.s-b.s);
    let total=0, cs=-1, ce=-1;
    f.forEach(x=>{ if(x.s>ce){ if(ce>cs) total+=ce-cs; cs=x.s; ce=x.e; } else ce=Math.max(ce,x.e); });
    if(ce>cs) total+=ce-cs;
    const per={}; f.forEach(x=>{ const g=group(x.t); per[g]=(per[g]||0)+(x.e-x.s); });
    const best=f.reduce((m,x)=>Math.max(m,x.e-x.s),0);
    const sum=t=>acts.filter(a=>a.title===t).reduce((s,a)=>s+(a.end-a.start),0);
    const rout=sum("Рутина"), walk=sum("Ходьба"), sport=sum("Спорт");
    return {total,per,best,sessions:f.length,rout,walk,sport};
  }

  function renderFocus(){
    const st=stats(view), goal=Math.max(15,settings.goalMin||600)*M;
    const today=view===dkey(new Date());
    $("focusLabel").textContent= today ? "Фокус сегодня" : "Фокус за день";
    $("ringV").textContent=hmm(st.total);
    const done=st.total>=goal;
    $("ring").classList.toggle("done",done);
    $("ringS").textContent= done ? (st.total-goal>=M ? "+"+hmm(st.total-goal)+" к цели" : "цель достигнута") : "из "+goalTxt(settings.goalMin);
    // arcs
    const R=62, SW=13, C=2*Math.PI*R, cx=74;
    const entries=Object.entries(st.per).sort((a,b)=>b[1]-a[1]);
    const raw=entries.reduce((s,e)=>s+e[1],0)||1;
    const frac=Math.min(1,st.total/goal);
    const gap=entries.length>1?2.2:0;
    let svg=`<circle cx="${cx}" cy="${cx}" r="${R}" stroke="var(--line)" stroke-width="${SW}" opacity=".6"/>`;
    let off=0;
    entries.forEach(([t,v])=>{
      const len=Math.max(0,C*frac*(v/raw)-gap); if(len<=0.3){ off+=C*frac*(v/raw); return; }
      const da=`${len} ${C-len}`, doff=-off;
      svg+=`<circle class="arc" cx="${cx}" cy="${cx}" r="${R}" stroke="${kc(t)}" stroke-width="${SW}" stroke-linecap="butt" stroke-dasharray="${da}" stroke-dashoffset="${doff}"/>`;
      off+=C*frac*(v/raw);
    });
    $("ringSvg").innerHTML=svg;

    const lg=$("legend"); lg.innerHTML="";
    if(!entries.length) ["Работа","Итальянский","Чтение"].forEach(t=>{ const li=el("li","zero"); li.append(swatch(t), el("span","nm",t), el("span","tm","0:00")); lg.append(li); });
    entries.slice(0,5).forEach(([t,v])=>{ const li=el("li"); li.append(swatch(t), el("span","nm",t), el("span","tm",hmm(v))); lg.append(li); });
    const facts=$("facts"); facts.innerHTML="";
    const fact=(lab,val)=>{ const s=el("span"); s.append(lab+" "); s.append(el("b",null,val)); facts.append(s); };
    if(st.sessions){ fact("лучшая сессия",hmm(st.best)); fact(plural(st.sessions,"сессия","сессии","сессий")+":",String(st.sessions)); }
    if(st.rout>=M) fact("рутина",hmm(st.rout));
    if(st.walk>=M) fact("ходьба",hmm(st.walk));
    if(st.sport>=M) fact("спорт",hmm(st.sport));
    const y=new Date(view+"T12:00:00"); y.setDate(y.getDate()-1); const ys=stats(dkey(y));
    if(ys.total>=M) fact(today?"вчера":"накануне",hmm(ys.total));
    facts.hidden=!facts.children.length;
  }

  function renderPicks(){

  function renderDay(){
    const tl=$("tl"); tl.innerHTML="";
    const now=Date.now(), todayK=dkey(new Date());
    const keys=[2,1,0].map(n=>{ const d=new Date(view+"T12:00:00"); d.setDate(d.getDate()-n); return dkey(d); });
    const cols=keys.map(k=>{ const items=days[k]?.items||[]; return {k,base:new Date(k+"T00:00:00").getTime(),acts:items.filter(i=>i.kind==="act"),notes:items.filter(i=>i.kind==="note")}; });
    // общий диапазон: с часа первого фокуса среди трёх дней
    let fh=[], ah=[], h1=24;
    cols.forEach(c=>{
      c.acts.forEach(a=>{ const hs=(a.start-c.base)/H; ah.push(hs); if(isFocus(a.title)) fh.push(hs); h1=Math.max(h1,Math.ceil(((a.end||now)-c.base)/H)); });
      c.notes.forEach(n=>ah.push((n.t-c.base)/H));
    });
    let h0 = fh.length ? Math.floor(Math.min(...fh)) : ah.length ? Math.floor(Math.min(...ah)) : (view===todayK ? new Date().getHours() : 7);
    h0=Math.max(0,Math.min(23,h0)); h1=Math.min(30,h1);
    const PX=window.innerWidth<480?44:50, top=8;
    $("rangeLbl").textContent=String(h0).padStart(2,"0")+":00 — "+String(h1%24).padStart(2,"0")+":00";

      h.append(el("span","ch-d",nm), el("span","ch-f",hmm(tot)), pr);

      const sorted=c.acts.slice().sort((a,b)=>(isRout(b.title)-isRout(a.title))||(a.start-b.start));
      const placed=[];

      placed.sort((p,q)=>p.ov-q.ov||p.s-q.s).forEach(({a,s,e,ov})=>{
        const b=el("button","band"+(ov?" ov":"")+(a.end?"":" live")+(lite(a.title)?" lite":"")); b.type="button";

        if(hgt<20||(ov&&hgt<46)) b.classList.add("tiny"); else if(hgt<38) b.classList.add("slim");
        const bt=el("span","bt"); bt.append(el("span","bn",short(a.title)), el("span","bm",hmm(e-a.start)));

  function renderChron(animate){
    const items=days[view]?.items||[];
    const tl=$("timeline"); tl.innerHTML="";
    $("chron").hidden=!items.length;
    if(!items.length){ lastIds=new Set(); return; }
    const acts=items.filter(i=>i.kind==="act").sort((x,y)=>x.start-y.start);
    const notes=items.filter(i=>i.kind==="note").sort((x,y)=>x.t-y.t);
    const ids=new Set(acts.map(x=>x.id)), byAct={}, free=[];
    notes.forEach(n=>{ if(n.actId&&ids.has(n.actId)) (byAct[n.actId]=byAct[n.actId]||[]).push(n); else free.push(n); });
    const seq=[...acts.map(x=>({t:x.start,x})),...free.map(x=>({t:x.t,x}))].sort((p,q)=>p.t-q.t);
    let lastEnd=null; const seen=new Set();
    const rail=(cls,t)=>{ const r=el("div","rail"); const n=el("span","node"+(cls||"")); if(t) n.style.background=kc(t); r.append(n); return r; };
    seq.forEach(({x})=>{

        const ev=el("div","ev act"+(x.end?"":" live")); ev.style.setProperty("--kc",kc(x.title));

        const c=el("div","c"); const hit=el("button","hit"); hit.type="button";

        if(x.endNote){ const r=el("div","refl"); r.append(el("span","lab","Итог"),x.endNote); c.append(r); }
        ev.append(t,rail("",x.title),c); tl.append(ev);
        if(animate&&!lastIds.has(x.id)) ev.classList.add("fade"); seen.add(x.id);
        const e=x.end||Date.now(); lastEnd=Math.max(lastEnd||0,e);

        const ev=el("div","ev note"); const c=el("div","c"); const b=el("button","hit"); b.type="button"; b.append(el("span","ntext",noteText(x))); b.onclick=()=>editNote(x); c.append(b);

      }
    });
    lastIds=seen;
  }

  function tick(){

      document.querySelectorAll(".par .ps").forEach(e=>e.textContent="параллельно · "+hmm(now-(+e.dataset.since)));
    } else {
      document.title="Между делами";
    }
  }

  /* ================= sheets ================= */
  let onSave=null, onDel=null;
  function fromTime(base,v){ if(!v) return null; const [h,m]=v.split(":").map(Number); const d=new Date(base); d.setHours(h,m,0,0); return d.getTime(); }
  function cap(t){ return el("p","cap",t); }
  function fld(type,val,ph){ const i=el(type==="area"?"textarea":"input","fld"); if(type!=="area") i.type=type; i.value=val||""; if(ph) i.placeholder=ph; return i; }
  function findLoc(id){ for(const k in days){ const i=days[k].items.findIndex(x=>x.id===id); if(i>=0) return {k,i}; } return null; }
  function openSheet(title,body,s,d){ $("sheetTitle").textContent=title; const b=$("sheetBody"); b.innerHTML=""; b.append(...body); onSave=s; onDel=d; $("sheetDel").hidden=!d; resetDel(); $("scrim").classList.add("open"); document.body.classList.add("lock"); }
  function closeSheet(){ $("scrim").classList.remove("open"); document.body.classList.remove("lock"); }
  function resetDel(){ const b=$("sheetDel"); delete b.dataset.sure; b.textContent="Удалить"; }
  function editAct(x){
    const tt=fld("text",x.title), s=fld("time",hm(x.start)), e=fld("time",x.end?hm(x.end):""), r=fld("area",x.endNote,"");
    const pair=el("div","pair"); const p1=el("div"); p1.append(cap("Начало"),s); const p2=el("div"); p2.append(cap(x.end?"Конец":"Конец (пусто — идёт)"),e); pair.append(p1,p2);
    openSheet("Дело",[cap("Название"),tt,pair,cap("Итог"),r],()=>{
      const st=fromTime(x.start,s.value)||x.start; let en=e.value?fromTime(x.end||x.start,e.value):null;
      if(en!=null&&en<st) en+=86400000;
      x.title=tt.value.trim()||x.title; x.start=st; x.end=en; x.endNote=r.value.trim();
      const L=findLoc(x.id); if(L) save(L.k);
    },()=>{ const L=findLoc(x.id); if(!L) return; days[L.k].items.splice(L.i,1); days[L.k].items.forEach(n=>{ if(n.actId===x.id) n.actId=null; }); save(L.k); });
  }
  function editNote(n){
    const t=fld("area",noteText(n),""), tm=fld("time",hm(n.t));
    openSheet("Запись",[cap("Текст"),t,cap("Время"),tm],()=>{
      const L=findLoc(n.id); if(!L) return; const d=days[L.k];
      n.text=t.value.trim(); delete n.emo; n.t=fromTime(n.t,tm.value)||n.t;
      const host=d.items.filter(a=>a.kind==="act"&&a.start<=n.t&&(!a.end||a.end>=n.t)).sort((a,b)=>isRout(a.title)-isRout(b.title))[0];
      n.actId=host?host.id:null; if(!n.text) d.items.splice(L.i,1); save(L.k);
    },()=>{ const L=findLoc(n.id); if(!L) return; days[L.k].items.splice(L.i,1); save(L.k); });
  }
  $("ring").onclick=()=>{
    let v=settings.goalMin||600;
    const st=el("div","stepper"); const minus=el("button",null,"−"), plus=el("button",null,"+"), val=el("b",null,goalTxt(v));
    minus.type=plus.type="button";
    minus.onclick=()=>{ v=Math.max(30,v-30); val.textContent=goalTxt(v); };
    plus.onclick=()=>{ v=Math.min(16*60,v+30); val.textContent=goalTxt(v); };
    st.append(minus,val,plus);
    openSheet("Цель фокуса на день",[cap("Сколько времени в фокусе"),st,el("p","hint","Рутина, ходьба и спорт в фокус не входят. Итальянский во время рутины — входит.")],()=>{ settings.goalMin=v; saveSettings(); },null);
  };
  $("sheetCancel").onclick=closeSheet;
  $("scrim").onclick=e=>{ if(e.target===$("scrim")) closeSheet(); };
  $("sheetSave").onclick=()=>{ onSave&&onSave(); closeSheet(); render(); };
  $("sheetDel").onclick=()=>{ const b=$("sheetDel"); if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Точно удалить?"; clearTimeout(b._h); b._h=setTimeout(resetDel,2600); return; } onDel&&onDel(); closeSheet(); render(); };
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

  /* ================= inputs ================= */
  const si=$("startInput"), sb=$("startBtn"), ni=$("noteInput"), nb=$("noteBtn"), en=$("endNote");
  function grow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,180)+"px"; }
  si.oninput=()=>{ sb.disabled=!si.value.trim(); };
  si.onkeydown=e=>{ if(e.key==="Enter"&&si.value.trim()){ e.preventDefault(); sb.click(); } };
  sb.onclick=()=>{ const v=si.value.trim(); if(!v) return; start(v); si.value=""; sb.disabled=true; si.blur(); };
  ni.oninput=()=>{ grow(ni); nb.disabled=!ni.value.trim(); };
  ni.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&ni.value.trim()){ e.preventDefault(); nb.click(); } };
  nb.onclick=()=>{ const v=ni.value.trim(); if(!v) return; addNote(v); ni.value=""; grow(ni); nb.disabled=true; };
  en.oninput=()=>grow(en);
  en.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("endBtn").click(); } };
  $("endBtn").onclick=()=>{ finish($("endBtn").dataset.id, en.value.trim()); en.value=""; grow(en); };
  function shift(n){ const d=new Date(view+"T12:00:00"); d.setDate(d.getDate()+n); const k=dkey(d); if(k<=dkey(new Date())){ view=k; render(); } }
  $("prev").onclick=()=>shift(-1); $("next").onclick=()=>shift(1);
  $("todayBtn").onclick=()=>{ view=dkey(new Date()); render(); };

  /* ================= export ================= */
  function dayText(k){
    const items=days[k]?.items||[];
    const acts=items.filter(i=>i.kind==="act").sort((a,b)=>a.start-b.start);
    const notes=items.filter(i=>i.kind==="note").sort((a,b)=>a.t-b.t);
    const ids=new Set(acts.map(a=>a.id));
    const seq=[...acts.map(a=>({t:a.start,a})),...notes.filter(n=>!n.actId||!ids.has(n.actId)).map(n=>({t:n.t,n}))].sort((p,q)=>p.t-q.t);
    const d=new Date(k+"T12:00:00");
    const head=d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})+", "+d.toLocaleDateString("ru-RU",{weekday:"long"});
    const st=stats(k);
    let out=head+"\n"+"—".repeat(Math.min(head.length,40))+"\nФокус: "+dur(st.total)+(st.rout>=M?" · рутина: "+dur(st.rout):"")+(st.walk>=M?" · ходьба: "+dur(st.walk):"")+(st.sport>=M?" · спорт: "+dur(st.sport):"")+"\n\n";
    seq.forEach(s=>{
      if(s.a){ const a=s.a;
        out+=`${hm(a.start)}–${a.end?hm(a.end):"…"}  ${a.title} (${dur((a.end||Date.now())-a.start)})\n`;
        notes.filter(n=>n.actId===a.id).forEach(n=>out+=`        ${hm(n.t)}  ${noteText(n).replace(/\n/g,"\n               ")}\n`);
        if(a.endNote) out+=`        Итог: ${a.endNote.replace(/\n/g,"\n              ")}\n`;
      } else out+=`${hm(s.n.t)}  ${noteText(s.n).replace(/\n/g,"\n       ")}\n`;
    });
    return out.trimEnd();
  }
  async function download(name,data,mime){
    if(inClaude){
      let dl=null; try{ dl=await claude.use("downloads"); }catch(e){}
      if(dl){ try{ await dl.save({filename:name,data}); toast("Файл сохранён"); return "ok"; }
        catch(e){ if(e&&e.code==="declined") return "declined"; if(e&&e.code==="rate_limited"){ toast("Подожди секунду и попробуй снова"); return "declined"; } return "fail"; } }
      return "fail";
    }
    try{ const url=URL.createObjectURL(new Blob([data],{type:mime+";charset=utf-8"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Файл сохранён"); return "ok"; }
    catch(e){ return "fail"; }
  }
  $("copyBtn").onclick=async()=>{ if(!(days[view]?.items||[]).length){ toast("В этом дне пока пусто"); return; } try{ await navigator.clipboard.writeText(dayText(view)); toast("День скопирован"); }catch(e){ toast("Не удалось скопировать"); } };
  $("exportBtn").onclick=async()=>{
    const keys=Object.keys(days).filter(k=>days[k].items&&days[k].items.length).sort();
    if(!keys.length){ toast("Пока нечего экспортировать"); return; }
    let acts=0,notes=0,focus=0; keys.forEach(k=>{ days[k].items.forEach(i=>i.kind==="act"?acts++:notes++); focus+=stats(k).total; });
    const txt="Между делами — журнал\nЭкспорт от "+new Date().toLocaleString("ru-RU",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})+
      "\n"+keys.length+" "+plural(keys.length,"день","дня","дней")+" · "+acts+" "+plural(acts,"дело","дела","дел")+" · "+notes+" "+plural(notes,"запись","записи","записей")+" · фокус всего: "+dur(focus)+
      "\n\n\n"+keys.map(dayText).join("\n\n\n")+"\n";
    const r=await download("mezhdu-delami-"+dkey(new Date())+".txt",txt,"text/plain");
    if(r==="fail"){ try{ await navigator.clipboard.writeText(txt); toast("Скачать не вышло — журнал скопирован"); }catch(e){ toast("Экспорт недоступен в этом окне"); } }
  };
  $("backupBtn").onclick=async()=>{
    const keys=Object.keys(days).filter(k=>days[k].items&&days[k].items.length);
    if(!keys.length){ toast("Пока нечего сохранять"); return; }
    const out={app:"mezhdu-delami",version:2,exported:new Date().toISOString(),settings,days:{}}; keys.sort().forEach(k=>out.days[k]=days[k]);
    const json=JSON.stringify(out,null,1);
    const r=await download("mezhdu-delami-backup-"+dkey(new Date())+".json",json,"application/json");
    if(r==="fail"){ try{ await navigator.clipboard.writeText(json); toast("Копия скопирована в буфер"); }catch(e){ toast("Не удалось сохранить копию"); } }
  };
  $("restoreBtn").onclick=()=>$("restoreFile").click();
  $("restoreFile").onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    try{
      const data=JSON.parse(await f.text()); const src=data&&data.days; if(!src||typeof src!=="object") throw 0;
      let added=0;
      for(const k in src){ if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(src[k].items)) continue;
        const d=day(k), have=new Set(d.items.map(i=>i.id));
        src[k].items.forEach(it=>{ if(it&&it.id&&(it.kind==="act"||it.kind==="note")&&!have.has(it.id)){ d.items.push(it); added++; } }); save(k); }
      if(data.settings&&data.settings.goalMin){ settings.goalMin=data.settings.goalMin; saveSettings(); }
      render(); toast(added?("Восстановлено записей: "+added):"Всё уже было на месте");
    }catch(err){ toast("Это не похоже на резервную копию"); }
  };

  /* ================= swipe ================= */
  let sx=null, sy=0;
  document.addEventListener("touchstart",e=>{ if(e.target.closest(".picks,.scrim,textarea,input,.tl")){ sx=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  document.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null; if(Math.abs(dx)>70&&Math.abs(dy)<40) shift(dx<0?1:-1); },{passive:true});

  loadLocal(); render(); connect();
  if(!inClaude && "serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load",()=>{ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} });
  }
})();
</script>
</body>
</html>
